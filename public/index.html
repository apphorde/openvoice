<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/app.css" />
    <title>OpenVoice</title>
  </head>
  <body class="min-h-dvh min-w-[320px] bg-[#080f20] font-sans text-[#f3f6fb]">
    <div id="app-root"></div>
    <template id="app-template">
      <main
        id="workspace"
        class="app-shell conversation-layout mx-auto flex min-h-dvh w-full flex-col px-2 py-2 sm:px-4 sm:py-3"
      >
        <header class="app-toolbar grid min-h-12 grid-cols-[1fr_auto_1fr] items-center gap-3">
          <button
            id="sidebarToggle"
            type="button"
            class="sidebar-toggle justify-self-start rounded-lg border border-[#28364b] px-3 py-2 text-sm text-[#a7b7cb] hover:bg-[#17243a]"
            aria-label="Toggle session sidebar"
            aria-controls="sessionSelection"
            attr-aria-expanded="String(sessionSelectionOpen)"
            on-click="toggleSessionSidebar()"
          >
            ☰ <span class="hidden sm:inline">Sessions</span>
          </button>
          <button
            id="sessionTitle"
            type="button"
            class="min-h-12 min-w-0 truncate px-2 text-center text-xl font-semibold tracking-tight hover:text-[#a7bcff] sm:text-2xl"
            on-click="openSessionSelection()"
            attr-aria-label="`Choose session: ${sessionTitle}`"
          >
            {{ sessionTitle }}
          </button>
          <span id="sessionMeta" class="sr-only">{{ sessionMeta }}</span>
          <div class="flex items-center justify-self-end gap-2">
            <span id="user" class="sr-only">{{ authUser }}</span>
            <p id="voiceStatus" class="sr-only" attr-data-state="voiceState" aria-live="polite">{{ statusText }}</p>
            <button
              id="voice"
              class="flex min-h-10 items-center gap-2 rounded-full border border-[#53627d] px-3 text-sm"
              type="button"
              attr-data-state="voiceState"
              attr-aria-pressed="String(voiceMode)"
              on-click="toggleVoice()"
              aria-labelledby="voiceLabel"
            >
              <svg class="size-5" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <g bind-hidden.bool="voiceMode">
                  <rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8" />
                  <path
                    d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </g>
                <g bind-hidden.bool="!voiceMode">
                  <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />
                </g>
              </svg>
              <span id="voiceLabel" class="sr-only">{{ voiceLabel }}</span>
            </button>
            <form method="post" action="/auth/logout">
              <button
                class="size-9 rounded-full text-[#8090aa] hover:bg-[#16233a]"
                aria-label="Log out"
                title="Log out"
              >
                ↗
              </button>
            </form>
          </div>
        </header>
        <button
          id="sidebarBackdrop"
          class="sidebar-backdrop"
          type="button"
          aria-label="Close session sidebar"
          bind-hidden.bool="!sessionSelectionOpen"
          on-click="closeSessionSelection()"
        ></button>
        <section
          id="sessionSelection"
          class="session-sidebar flex min-h-0 flex-col gap-3 overflow-auto py-2"
          attr-data-open="String(sessionSelectionOpen)"
          aria-label="Select session"
        >
          <div class="flex items-center justify-between border-b border-[#25324a] pb-2">
            <h2 class="text-lg font-semibold">Sessions</h2>
            <div class="flex gap-1">
              <button
                id="newSession"
                class="size-10 rounded-full text-xl hover:bg-[#1b2941]"
                aria-label="Start new session"
                on-click="startNewSession()"
              >
                +
              </button>
              <button
                id="refresh"
                class="size-10 rounded-full text-xl hover:bg-[#1b2941]"
                aria-label="Refresh sessions"
                on-click="refreshSessions()"
              >
                ↻
              </button>
              <button
                id="closeSessionSidebar"
                class="sidebar-close rounded-lg px-3 text-sm hover:bg-[#1b2941]"
                aria-label="Close session selection"
                on-click="closeSessionSelection()"
              >
                Close
              </button>
            </div>
          </div>
          <div id="list" class="grid min-h-0 flex-1 content-start gap-1 overflow-auto">
            <template foreach="session of sessions">
              <button
                type="button"
                class="grid w-full gap-1 border-b border-[#25324a] px-2 py-3 text-left hover:bg-[#16233a] focus-visible:outline-2 focus-visible:outline-[#7595ff]"
                class-border-mint="session.id === selectedId"
                on-click="selectSession(session.id)"
              >
                <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ session.title }}</span>
                <small class="overflow-hidden text-ellipsis whitespace-nowrap text-xs text-[#8090aa]"
                  >{{ session.status === 'running' ? 'Working' : session.directory || '' }}</small
                >
              </button>
            </template>
          </div>
          <details id="goalsPanel" class="border-t border-[#25324a] pt-3">
            <summary class="cursor-pointer text-sm text-[#9eabc1]">
              Executive goals <span id="goalCount" class="text-xs text-[#71809a]">{{ goalCount }}</span>
            </summary>
            <p class="my-3 text-sm text-[#9eabc1]">
              Goals are stored centrally. Share them with sessions only when you choose.
            </p>
            <button
              id="applyPlanToCurrentSession"
              class="my-2 min-h-10 rounded-lg bg-[#5277e8] px-3 text-sm hover:bg-[#6488f5] disabled:opacity-50"
              type="button"
              bind-disabled.bool="!selectedId"
              on-click="applyPlanToCurrentSession()"
            >
              Send goals to current session
            </button>
            <button
              id="applyPlan"
              class="my-2 min-h-10 rounded-lg border border-[#25324a] px-3 text-sm hover:bg-[#16233a]"
              type="button"
              on-click="applyPlan()"
            >
              Send plan to all top-level sessions
            </button>
            <p id="goalNotice" class="my-2 text-sm text-[#9eabc1]" aria-live="polite">{{ goalNotice }}</p>
            <form id="goalForm" class="grid gap-2" on-submit.prevent="addGoal()">
              <label class="text-sm" for="goalTitle">Goal</label
              ><input
                class="w-full rounded-lg border border-[#25324a] bg-[#080f20] p-3"
                id="goalTitle"
                bind-value="goalTitle"
                on-input="setGoalTitle($event.target.value)"
                maxlength="200"
                required
                placeholder="What outcome matters?"
              />
              <label class="text-sm" for="goalDescription">Success criteria</label
              ><textarea
                class="w-full rounded-lg border border-[#25324a] bg-[#080f20] p-3"
                id="goalDescription"
                bind-value="goalDescription"
                on-input="setGoalDescription($event.target.value)"
                rows="2"
                maxlength="4000"
              ></textarea>
              <button class="min-h-10 rounded-lg bg-[#5277e8] px-4 font-semibold text-white" type="submit">
                Add goal
              </button>
            </form>
            <div id="goals" class="mt-3 grid gap-2">
              <template foreach="goal of goals">
                <div class="flex items-center justify-between gap-3 border-t border-[#25324a] py-2">
                  <span class="min-w-0 flex-1 break-words text-xs"
                    >{{ goal.description ? goal.title + ' — ' + goal.description : goal.title }}</span
                  >
                  <select
                    class="max-w-28 rounded border border-[#25324a] bg-[#080f20] p-2 text-sm"
                    bind-value="goal.status"
                    on-change="updateGoal(goal.id, { status: $event.target.value })"
                    aria-label="Goal status"
                  >
                    <option value="open">open</option>
                    <option value="in-progress">in-progress</option>
                    <option value="done">done</option>
                  </select>
                  <button
                    type="button"
                    class="min-h-10 min-w-10 rounded-lg border border-[#25324a] text-xl"
                    attr-aria-label="`Delete ${goal.title}`"
                    on-click="deleteGoal(goal.id)"
                  >
                    ×
                  </button>
                </div>
              </template>
            </div>
          </details>
        </section>
        <div class="conversation-workspace flex min-h-0 flex-1 flex-col">
          <section
            id="conversation"
            class="chat-history my-1 flex min-h-0 flex-1 flex-col gap-2 overflow-auto rounded-xl border border-[#202c43] bg-[#0d1729] p-2"
            aria-live="polite"
            aria-label="Conversation"
          >
            <template if="messages.length === 0">
              <p id="emptyConversation" class="m-auto p-6 text-center text-sm text-muted">
                {{ selectedId ? 'No messages in this session yet.' : 'Choose a session to begin.' }}
              </p>
            </template>
            <template foreach="message of messages">
              <article
                class="max-w-[96%] py-1 sm:max-w-[88%]"
                class-mr-auto="message.role === 'assistant'"
                class-ml-auto="message.role === 'user'"
              >
                <span class="text-xs font-semibold text-mint"
                  >{{ message.role === 'assistant' ? 'Assistant' : 'You' }}</span
                >
                <div
                  class="my-1 whitespace-pre-wrap break-words text-sm leading-5 [&_a]:text-mint [&_pre]:overflow-auto [&_pre]:rounded [&_pre]:bg-black [&_pre]:p-2 [&_code]:font-mono [&_ul]:list-disc [&_ol]:list-decimal [&_ul]:pl-5 [&_ol]:pl-5"
                  bind-innerhtml="message.html"
                ></div>
                <time class="text-[10px] text-muted">{{ message.timeLabel }}</time>
              </article>
            </template>
          </section>

          <section id="keyboardInput" class="w-full border-t border-[#202c43] py-2">
            <p id="transcriptPreview" class="sr-only" bind-hidden.bool="draftVisible">{{ transcriptPreview }}</p>
            <form id="composer" class="mt-3 grid gap-2" on-submit.prevent="sendTypedPrompt()">
              <textarea
                id="voiceDraft"
                class="min-h-20 w-full rounded-xl border border-[#25324a] bg-[#0d1729] p-4 text-[#f3f6fb] placeholder:text-[#71809a] focus-visible:outline-2 focus-visible:outline-[#7595ff]"
                aria-label="Review and edit dictated message"
                aria-describedby="draftHint"
                placeholder="Review your dictated message before sending…"
                bind-hidden.bool="!draftVisible"
                bind-value="draftText"
                on-input="updateDraft($event.target.value)"
              ></textarea>
              <p id="draftHint" class="sr-only">Review and edit your dictated message before choosing Send.</p>
              <div id="draftActions" class="flex flex-wrap items-center gap-2" bind-hidden.bool="!draftVisible">
                <button
                  id="sendDraft"
                  class="min-h-10 rounded-full bg-[#5277e8] px-5 font-semibold text-white disabled:opacity-50"
                  type="button"
                  bind-disabled.bool="sendDraftDisabled"
                  on-click="sendDraft()"
                >
                  Send
                </button>
                <button
                  id="resumeVoice"
                  class="min-h-10 rounded-full border border-[#25324a] px-4 text-sm hover:bg-[#16233a]"
                  type="button"
                  bind-disabled.bool="resumeDisabled"
                  on-click="resumeDictation()"
                >
                  Resume dictation
                </button>
                <button
                  id="discardDraft"
                  class="min-h-10 rounded-full border border-[#25324a] px-4 text-sm hover:bg-[#16233a]"
                  type="button"
                  bind-disabled.bool="discardDisabled"
                  on-click="discardDraft()"
                >
                  Discard
                </button>
              </div>
              <textarea
                class="w-full rounded-xl border border-[#25324a] bg-[#0d1729] p-4 text-[#f3f6fb] placeholder:text-[#71809a] focus-visible:outline-2 focus-visible:outline-[#7595ff]"
                id="prompt"
                aria-label="Message"
                rows="2"
                placeholder="Message…"
                bind-hidden.bool="draftVisible"
                bind-value="prompt"
                on-input="updatePrompt($event.target.value)"
              ></textarea>
              <button
                id="send"
                class="min-h-10 justify-self-end rounded-full bg-[#5277e8] px-6 font-semibold text-white hover:bg-[#6488f5] disabled:opacity-50"
                type="submit"
                bind-hidden.bool="draftVisible"
                bind-disabled.bool="sendDisabled"
              >
                Send
              </button>
            </form>
            <div class="narration-dock mt-2 flex items-center justify-between gap-3">
              <p class="min-w-0 truncate text-xs text-[#8090aa]">{{ statusText }}</p>
              <button
                id="readLastMessage"
                class="min-h-10 shrink-0 rounded-full border border-[#53627d] px-4 text-sm text-[#c7d3e5] hover:bg-[#16233a] disabled:opacity-50"
                type="button"
                bind-disabled.bool="readLastMessageDisabled"
                on-click="readLastMessage()"
              >
                {{ readLastMessageLabel }}
              </button>
            </div>
          </section>
        </div>
        <audio id="player" hidden></audio>
        <footer id="connectionStatus" class="sr-only">
          Voice works while this app stays open. Microphone access is controlled by your browser.
        </footer>
      </main>
    </template>
    <script src="/li3-config.js"></script>
    <script src="/app.bundle.js"></script>
  </body>
</html>
